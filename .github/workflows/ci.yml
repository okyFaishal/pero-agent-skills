name: CI Integrity & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Skills, Gates & Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gate 1: Lint Shell Script Syntax
        run: |
          find . -type f \( -name "*.sh" -o -path "*/scripts/*" \) ! -path "*/.git/*" -print0 | xargs -0 -n 1 bash -n

      - name: Gate 2: ShellCheck Static Analysis
        run: |
          if ! command -v shellcheck &> /dev/null; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              brew install shellcheck
            else
              sudo apt-get update && sudo apt-get install -y shellcheck
            fi
          fi
          find . -type f \( -name "*.sh" -o -path "*/scripts/*" \) ! -path "*/.git/*" -print0 | xargs -0 shellcheck

      - name: Gate 3: Test Installer Dry-Run Mode & Version Flag
        run: |
          bash install.sh --dry-run
          bash install.sh --version | grep -q "pero-agent-skills installer"

      - name: Gate 4: Test Sandbox Installation & Space-Path Handling
        run: |
          SANDBOX_ROOT="$(mktemp -d)"
          SANDBOX_DIR="${SANDBOX_ROOT}/target workspace with spaces"
          echo "Testing installation in sandbox with spaces: ${SANDBOX_DIR}"
          bash install.sh "${SANDBOX_DIR}"
          bash install.sh "${SANDBOX_DIR}" --check
          diff -r skills/ "${SANDBOX_DIR}/.agents/skills/"
          rm -rf "${SANDBOX_ROOT}"

      - name: Gate 5: Workspace Skills Synchronization (diff -r)
        run: |
          bash install.sh .
          diff -r skills/ .agents/skills/
          bash install.sh --check

      - name: Gate 6: Skill Catalog Registry Validation (install.sh & AGENTS.md)
        run: |
          FAILED=0
          for skill_dir in skills/*; do
            skill="$(basename "$skill_dir")"
            if ! grep -q "\"$skill\"" install.sh; then
              echo "❌ Skill '$skill' tidak terdaftar di array SKILLS pada install.sh"
              FAILED=$((FAILED + 1))
            fi
            if ! grep -q "$skill" AGENTS.md; then
              echo "❌ Skill '$skill' tidak terdaftar di AGENTS.md"
              FAILED=$((FAILED + 1))
            fi
          done

          TOTAL_SKILLS=$(grep -E '^\s+"[a-zA-Z0-9_-]+"' install.sh | wc -l | tr -d ' ')
          FOLDER_COUNT=$(ls -d skills/* | wc -l | tr -d ' ')
          if [ "$TOTAL_SKILLS" -ne "$FOLDER_COUNT" ]; then
            echo "❌ Jumlah skill di install.sh ($TOTAL_SKILLS) tidak sama dengan folder di skills/ ($FOLDER_COUNT)"
            FAILED=$((FAILED + 1))
          fi

          if [ $FAILED -gt 0 ]; then
            echo "❌ Total kegagalan konsistensi katalog: $FAILED"
            exit 1
          fi
          echo "✓ Seluruh $FOLDER_COUNT skill terdaftar konsisten di install.sh dan AGENTS.md"

      - name: Gate 7: Verify Frontmatter Schema & YAML Syntax in All Skills
        run: |
          python3 -m pip install -q pyyaml || true
          python3 - << 'EOF'
          import glob, os, sys

          try:
              import yaml
              def parse_yaml(text):
                  return yaml.safe_load(text)
          except ImportError:
              def parse_yaml(text):
                  res = {}
                  lines = text.splitlines()
                  current_key = None
                  for line in lines:
                      stripped = line.strip()
                      if not stripped or stripped.startswith("#"):
                          continue
                      if ":" in line and not line.startswith(" ") and not line.startswith("\t"):
                          k, v = line.split(":", 1)
                          current_key = k.strip()
                          res[current_key] = v.strip().strip("'\"")
                      elif current_key and (line.startswith(" ") or line.startswith("\t")):
                          res[current_key] += " " + stripped.strip("'\"")
                  return res

          failed = 0
          skill_files = sorted(glob.glob("skills/*/SKILL.md"))

          if not skill_files:
              print("❌ Tidak ada berkas SKILL.md ditemukan di skills/*")
              sys.exit(1)

          for skill_file in skill_files:
              skill_dir = os.path.dirname(skill_file)
              expected_name = os.path.basename(skill_dir)

              with open(skill_file, "r", encoding="utf-8") as f:
                  content = f.read()

              if not content.startswith("---"):
                  print(f"❌ {skill_file}: Tidak diawali oleh pembuka frontmatter '---'")
                  failed += 1
                  continue

              parts = content.split("---", 2)
              if len(parts) < 3:
                  print(f"❌ {skill_file}: Tidak memiliki penutup frontmatter '---'")
                  failed += 1
                  continue

              raw_yaml = parts[1]

              try:
                  data = parse_yaml(raw_yaml)
              except Exception as e:
                  print(f"❌ {skill_file}: Kesalahan sintaks YAML frontmatter: {e}")
                  failed += 1
                  continue

              if not isinstance(data, dict):
                  print(f"❌ {skill_file}: Frontmatter bukan format mapping YAML yang valid")
                  failed += 1
                  continue

              if "name" not in data or not str(data["name"]).strip():
                  print(f"❌ {skill_file}: Field 'name' wajib ada dan tidak boleh kosong")
                  failed += 1
              elif data["name"] != expected_name:
                  print(f"❌ {skill_file}: Nilai 'name' ({data['name']}) tidak cocok dengan nama direktori ({expected_name})")
                  failed += 1

              if "description" not in data or not str(data["description"]).strip():
                  print(f"❌ {skill_file}: Field 'description' wajib ada dan tidak boleh kosong")
                  failed += 1
              elif len(str(data["description"]).strip()) < 15:
                  print(f"❌ {skill_file}: 'description' terlalu pendek (minimal 15 karakter)")
                  failed += 1

          if failed > 0:
              print(f"\n❌ Total kegagalan validasi YAML frontmatter: {failed}")
              sys.exit(1)

          print(f"✓ Seluruh {len(skill_files)} SKILL.md terverifikasi valid secara sintaks dan skema.")
          EOF

      - name: Gate 8: Line-Ending & Trailing Newline Hygiene
        run: |
          FAILED=0
          for f in $(git ls-files "*.md" "*.sh" "*.yml"); do
            if [ -f "$f" ]; then
              if grep -q $'\r' "$f"; then
                echo "❌ CRLF character found in $f"
                FAILED=$((FAILED + 1))
              fi
              if [ -n "$(tail -c 1 "$f")" ]; then
                echo "❌ Missing EOF trailing newline in $f"
                FAILED=$((FAILED + 1))
              fi
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "❌ Total file hygiene violations: $FAILED"
            exit 1
          fi
          echo "✓ All tracked markdown, shell, and YAML files have clean UNIX line endings."

      - name: Gate 9: Validate Local Relative File Paths in Markdown
        run: |
          python3 - << 'EOF'
          import glob, os, re, sys

          link_pattern = re.compile(r"\[([^\]]+)\]\(([^)]+)\)")
          failed = 0
          checked_links = 0

          md_files = sorted(glob.glob("**/*.md", recursive=True))

          for md_file in md_files:
              if ".git" in md_file:
                  continue

              file_dir = os.path.dirname(md_file)
              with open(md_file, "r", encoding="utf-8") as f:
                  lines = f.readlines()

              for line_idx, line in enumerate(lines, 1):
                  for match in link_pattern.finditer(line):
                      text, target = match.group(1), match.group(2)
                      target = target.strip()

                      if target.startswith(("http://", "https://", "mailto:", "#")):
                          continue

                      clean_target = target.split("#")[0].strip()
                      if not clean_target:
                          continue

                      checked_links += 1
                      resolved_path = os.path.normpath(os.path.join(file_dir, clean_target))

                      if not os.path.exists(resolved_path):
                          print(f"❌ Broken link pada {md_file}:{line_idx}")
                          print(f"   Teks   : [{text}]")
                          print(f"   Target : ({target})")
                          print(f"   Dicari : {resolved_path}\n")
                          failed += 1

          if failed > 0:
              print(f"❌ Total broken markdown links ditemukan: {failed}")
              sys.exit(1)

          print(f"✓ Seluruh {checked_links} tautan markdown relatif lokal terverifikasi utuh dan valid.")
          EOF


